version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
    groups:
      nestjs: { patterns: ["@nestjs/*"] }
      heroui: { patterns: ["@heroui/*"] }
      tanstack: { patterns: ["@tanstack/*"] }
    # Major-апгрейды этих пакетов требуют ручной миграции (TS 6 ломает
    # @types/cascading typings, Prisma 7 — schema-tooling, vitest 4 — API,
    # react-router-dom 7 — data router / Suspense). Снимать ignore точечно,
    # когда планируется миграция отдельным PR.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: react-router-dom
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
