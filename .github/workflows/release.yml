name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

# Multi-arch без QEMU: amd64 и arm64 собираются на нативных раннерах, затем
# объединяются в один manifest (иначе arm64 на ubuntu-24.04 amd64 идёт через
# QEMU — в разы медленнее и часто падает на native addons: argon2, esbuild, prisma).
#
# linux/arm64 раннеры — бесплатный tier только для публичных репозиториев
# (см. https://github.blog/changelog/2025-01-16-linux-arm64-hosted-runners-now-available-for-free-in-public-repositories-public-preview/).
# Для приватного репозитория job arm64 не найдёт раннер — оставьте только
# ветку amd64 (удалите вторую запись matrix.include) или используйте self-hosted arm64.

jobs:
  image:
    name: build (${{ matrix.suffix }}) & push arch tag
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GHCR owner (lowercase)
        id: ghcr
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push (${{ matrix.platform }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/${{ steps.ghcr.outputs.owner }}/api:${{ github.ref_name }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.title=HAFlux API
            org.opencontainers.image.description=Multi-HAProxy control plane (NestJS + Fastify, bundles SPA)
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ github.ref_name }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=api-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=api-${{ matrix.suffix }}

  merge-manifest:
    name: merge multi-arch manifest
    runs-on: ubuntu-24.04
    needs: [image]
    timeout-minutes: 10
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
      image: ${{ steps.ghcr.outputs.image }}
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: GHCR image ref (lowercase owner)
        id: ghcr
        run: |
          o=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "owner=${o}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${o}/api" >> "$GITHUB_OUTPUT"

      - name: Create manifest list (all release tags)
        id: merge
        env:
          REG: ${{ steps.ghcr.outputs.image }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${REF#v}"
          MINOR="${VER%.*}"
          MAJOR="${VER%%.*}"
          AMD="${REG}:${REF}-amd64"
          ARM="${REG}:${REF}-arm64"
          docker buildx imagetools create \
            --tag "${REG}:${REF}" \
            --tag "${REG}:${VER}" \
            --tag "${REG}:${MINOR}" \
            --tag "${REG}:${MAJOR}" \
            --tag "${REG}:latest" \
            "${AMD}" "${ARM}"
          DIGEST="$(docker buildx imagetools inspect "${REG}:${REF}" | sed -n 's/^Digest:[[:space:]]*//p' | head -n1)"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

  release:
    name: github release
    runs-on: ubuntu-24.04
    needs: [merge-manifest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Container image

            ```
            docker pull ${{ needs.merge-manifest.outputs.image }}:${{ github.ref_name }}
            ```

            Multi-arch (native build, no QEMU): `linux/amd64`, `linux/arm64`.  
            Index digest: `${{ needs.merge-manifest.outputs.digest }}`

            ## Quickstart

            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd $(basename ${{ github.repository }})
            git checkout ${{ github.ref_name }}
            cp deploy/docker/env.example deploy/docker/.env
            ./deploy/docker/scripts/init-secrets.sh
            docker compose -f deploy/docker/compose.yml --env-file deploy/docker/.env up -d
            ```
