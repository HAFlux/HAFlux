name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node (lint / typecheck / build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.18.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma client
        working-directory: apps/api
        run: pnpm prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  go:
    name: Go agent (vet / build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: apps/agent/go.sum
      - name: Tidy
        run: go mod tidy -diff || true
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o /tmp/agent ./cmd/agent

  docker:
    name: Docker build (smoke)
    runs-on: ubuntu-24.04
    needs: [node, go]
    steps:
      - uses: actions/checkout@v4
      - name: Set up buildx
        uses: docker/setup-buildx-action@v3
      - name: Build api image
        run: docker build -f apps/api/Dockerfile -t haflux/api:ci .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t haflux/web:ci .
      - name: Build agent image
        run: docker build -f apps/agent/Dockerfile -t haflux/agent:ci .
