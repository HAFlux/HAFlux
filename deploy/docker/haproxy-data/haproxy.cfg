# Bootstrap haproxy.cfg — будет полностью перезаписан панелью при первом Apply.
# До этого момента HAProxy запускается с минимальной конфигурацией, чтобы
# контейнер мог стартовать.

global
  maxconn 4000
  daemon
  log stdout local0 info
  stats socket /var/run/haproxy/admin.sock mode 0660 level admin expose-fd listeners

defaults
  mode http
  log global
  option httplog
  option dontlognull
  timeout connect 5s
  timeout client  30s
  timeout server  30s
