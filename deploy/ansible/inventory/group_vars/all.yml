---
# ─── Общие переменные ────────────────────────────────────────────────────

haflux_repo_url: "https://github.com/haflux/haflux.git"
haflux_repo_ref: "main"
haflux_install_dir: "/opt/haflux"

# Куда складывать сгенерированные секреты на control-plane (root:root, 0600).
haflux_secrets_dir: "{{ haflux_install_dir }}/.secrets"

# URL control-plane, как его видят HAProxy ноды.
haflux_control_plane_host: "{{ groups['control_plane'][0] }}"
haflux_control_plane_port: 3000
haflux_control_plane_url: "http://{{ haflux_control_plane_host }}:{{ haflux_control_plane_port }}"

# Версии
haflux_haproxy_image: "haproxy:3.1.17-alpine"
haflux_postgres_version: "16-alpine"
haflux_redis_version: "7-alpine"

# Директория с haproxy.cfg + модулями (и на control-plane, и на нодах)
haflux_haproxy_data_dir: "/etc/haproxy"
haflux_haproxy_container_name: "haproxy-balancer"

# Bootstrap root-пользователя
haflux_root_email: "admin@haflux.local"

# Открывать ли в UFW порты 80/443 на нодах
haflux_open_http_ports: true

# Способ деплоя:
#   build  — клонируем репо и собираем образы локально (по умолчанию пока нет registry)
#   pull   — берём образы из registry (см. haflux_image_*)
haflux_image_source: "build"
haflux_image_registry: "ghcr.io/haflux"
haflux_image_tag: "main"

# Порты UI и API на control-plane
haflux_web_port: 8080
haflux_api_port: 3000

# ─── SSH-доступ панели к нодам ───────────────────────────────────────────
# Публичный ключ панели (ed25519). Будет уложен в authorized_keys на нодах.
# Сгенерируйте на control-plane (после первого `up`) — Settings → SSH key.
# Или сгенерируйте локально и передайте через --extra-vars.
haflux_panel_pubkey: ""    # ssh-ed25519 AAAA... haflux
haflux_node_user: "haflux"
