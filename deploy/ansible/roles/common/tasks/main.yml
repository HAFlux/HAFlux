---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.os_family == "Debian"

- name: Install base packages
  ansible.builtin.package:
    name:
      - ca-certificates
      - curl
      - gnupg
      - git
      - ufw
      - python3-pip
      - python3-venv
      - rsync
    state: present

- name: Ensure target install directory exists
  ansible.builtin.file:
    path: "{{ haflux_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure secrets directory exists
  ansible.builtin.file:
    path: "{{ haflux_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Set timezone (UTC by default)
  community.general.timezone:
    name: "{{ haflux_timezone | default('UTC') }}"

# ─── Swap ──────────────────────────────────────────────────────────────
# Контейнерная сборка api (pnpm install + tsc + nest build) требует ≥1.5GB.
# На VPS с 1GB RAM без swap процесс падает OOM. Создаём swap, если RAM ≤ 2GB
# и swap отсутствует.
- name: Detect total RAM and swap
  ansible.builtin.set_fact:
    _total_ram_mb:  "{{ ansible_facts.memtotal_mb | int }}"
    _total_swap_mb: "{{ ansible_facts.swaptotal_mb | int }}"

- name: Ensure swap file
  when:
    - haflux_ensure_swap | default(true)
    - (_total_ram_mb | int) <= 2048
    - (_total_swap_mb | int) < 1024
  block:
    - name: Allocate /swapfile (2G)
      ansible.builtin.command:
        cmd: "fallocate -l {{ haflux_swap_size | default('2G') }} /swapfile"
        creates: /swapfile

    - name: Permissions on /swapfile
      ansible.builtin.file:
        path: /swapfile
        owner: root
        group: root
        mode: "0600"

    - name: mkswap
      ansible.builtin.command: mkswap /swapfile
      register: _mkswap
      changed_when: "'Setting up swapspace' in (_mkswap.stdout | default(''))"
      failed_when:
        - _mkswap.rc != 0
        - "'already' not in (_mkswap.stderr | default(''))"

    - name: swapon
      ansible.builtin.command: swapon /swapfile
      register: _swapon
      changed_when: _swapon.rc == 0
      failed_when:
        - _swapon.rc != 0
        - "'already active' not in (_swapon.stderr | default(''))"

    - name: Persist in /etc/fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        line: "/swapfile none swap sw 0 0"
        regexp: '^/swapfile\s'
        state: present

- name: Enable UFW (firewall) — but allow SSH first
  block:
    - name: Allow OpenSSH in UFW
      community.general.ufw:
        rule: allow
        name: OpenSSH
    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny
        direction: incoming
  when: haflux_enable_ufw | default(false)
